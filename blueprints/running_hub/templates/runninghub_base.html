<!-- runninghub_base.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}RunningHub{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('running_hub.static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;600;700;800&family=Roboto+Mono&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    {% block extra_css %}{% endblock %}
    {% block head_scripts %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a href="{{ url_for('running_hub.home') }}">
                <h1 class="logo">RUNNING<span>HUB</span></h1>
            </a>
            <p class="tagline">{% block tagline %}Your running dashboard{% endblock %}</p>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>RunningHub &copy; 2025 | Your personal running analytics platform</p>
        </div>
    </footer>


</body>
{% block scripts %}{% endblock %}

</html>
