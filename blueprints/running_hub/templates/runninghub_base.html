<!-- runninghub_base.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}RunningHub{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('running_hub.static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180"
        href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;600;700;800&family=Roboto+Mono&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    {% block extra_css %}{% endblock %}
    {% block head_scripts %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a href="{{ url_for('running_hub.home') }}">
                <img src="{{ url_for('running_hub.static', filename='images/running_hub_logo_long_transparent.png') }}"
                    alt="Running Hub Logo" class="logo" />
            </a>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>RunningHub &copy; 2025 | Your personal running analytics platform</p>
        </div>
    </footer>


</body>
{% block scripts %}{% endblock %}

</html>
