{% extends "base.html" %}

{% block title %}RunningHub | Calendar{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% endblock %}

{% block head_scripts %}
<script>
  const EVENTS_API_URL = "{{ url_for('running_hub.get_planned_workouts') }}";
  const POST_API_URL = "{{ url_for('running_hub.save_planned_workout') }}";
</script>
<script src="{{ url_for('running_hub.static', filename='js/calendar.js') }}" defer></script>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>
{% endblock %}

{% block content %}
<div id="calendar"></div>

<!-- Sidebar Modal -->
<div id="eventModal" class="modal-sidebar" style="display: none;">
  <div class="sidebar-content">
    <span class="close-button" onclick="document.getElementById('eventModal').style.display='none';">&times;</span>
    <form id="workoutForm">
      <input type="hidden" id="workout_id" name="id" />

      <!-- Inputs -->
      <label for="workout_date">Date</label>
      <input type="date" id="workout_date" name="workout_date" required />

      <label for="workout_name">Workout Name</label>
      <input type="text" id="workout_name" name="workout_name" placeholder="e.g. 5x1K @ 5K pace" />

      <label for="workout_type">Workout Type</label>
      <select id="workout_type" name="workout_type">
        <option value="">-- Select Type --</option>
        <option value="Workout">Workout</option>
        <option value="Race">Race</option>
        <option value="Long Run">Long Run</option>
        <option value="GA">GA</option>
        <option value="Trail">Trail</option>
      </select>

      <label for="effort">Effort (1–10)</label>
      <input type="number" id="effort" name="effort" min="1" max="10" />

      <label for="success">Completed Full Workout?</label>
      <select id="success" name="success">
        <option value="">-- Select --</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <label for="planned_notes">Planned Notes</label>
      <textarea id="planned_notes" name="planned_notes" rows="5"></textarea>

      <label for="recap_notes">Recap Notes</label>
      <textarea id="recap_notes" name="recap_notes" rows="5"></textarea>

      <label for="linked_activity_id">Link to Strava Activity</label>
      <select id="linked_activity_id" name="linked_activity_id">
        <option value="">-- Optional --</option>
        {% for activity in recent_activities %}
        <option value="{{ activity.id }}">
          {{ activity.start_date_local[:10] }} - {{ activity.name|truncate(50) }}
        </option>
        {% endfor %}
      </select>

      <div style="margin-top: 12px;">
        <button type="submit">Save</button>
        <button type="button" id="deleteWorkoutBtn"
          style="background: #c00; color: white; display: none; margin-left: 10px;">Delete</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
